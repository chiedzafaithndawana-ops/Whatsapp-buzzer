name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project if present
        run: |
          if [ -f "WhatsAppBuzzer.zip" ]; then
            echo "Found WhatsAppBuzzer.zip, extracting..."
            unzip -o WhatsAppBuzzer.zip -d extracted
            mkdir -p build_project
            if [ -d "extracted/WhatsAppBuzzer" ]; then
              cp -r extracted/WhatsAppBuzzer/. build_project/
            else
              cp -r extracted/. build_project/
            fi
          else
            echo "No zip found, assuming project files are already at repo root."
            mkdir -p build_project
            cp -r ./* build_project/ 2>/dev/null || true
          fi

      - name: Fix repository conflict in build.gradle
        working-directory: build_project
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.5.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: build_project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppBuzzer-debug-apk
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
