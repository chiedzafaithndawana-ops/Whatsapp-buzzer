name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project if present
        run: |
          if [ -f "WhatsAppBuzzer.zip" ]; then
            echo "Found WhatsAppBuzzer.zip, extracting..."
            unzip -o WhatsAppBuzzer.zip -d extracted
            mkdir -p build_project
            if [ -d "extracted/WhatsAppBuzzer" ]; then
              cp -r extracted/WhatsAppBuzzer/. build_project/
            else
              cp -r extracted/. build_project/
            fi
          else
            echo "No zip found, assuming project files are already at repo root."
            mkdir -p build_project
            cp -r ./* build_project/ 2>/dev/null || true
          fi

      - name: Fix repository conflict in build.gradle
        working-directory: build_project
        run: |
          c
